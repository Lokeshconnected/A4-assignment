<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deepstyle</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet"/>
</head>
<body>
    <nav>
        <div class="logo">
            <img src="./logo.png" alt="">
        </div>
        <div class="options">
            <h3>New Arrivals</h3>
            <h3>Shop</h3>
            <h3>Beauty</h3>
            <h3>Sale</h3>
            <h3>Journal</h3>
        </div>
        <div class="icons">
            <i class="ri-search-line"></i>
            <img src="./b.png" alt="">
            <div class="cartdiv">
                <i class="ri-shopping-cart-line"></i>
            </div>
        </div>
    </nav>
     <div class="line">   
    </div>
    <section>
        <div class="leftdiv">
            <img class="s1" src="./sunflower1.png" alt="">
            <h5>Summer Collection</h5>
            <h2>TRANDY AND <br>CLUSSI FOR <br>NEW SEASON</h2>
            <div class="leftimg">
                <img src="./image1.png" alt="">
            </div>
            <img class="c1" src="./comma.png" alt="">
        </div>
        <div class="centergrid">
            <div class="top">
                <img src="./sunflower2.png" alt="">
                <h1>Make Your Fashion Look <br> More Charming</h1>
            </div>
            <div class="bottomleft">
                <div class="lefttopimg">
                    <img  src="./image2.png" alt="">
                </div>
                <div class="leftbottomimg">
                    <img src="./image3.png" alt="">
                </div>
            </div>
            <div class="bottomcenter">
                <img class="i1" src="./star.png" alt="">
                <div class="centerimg">
                    <img src="./image4.png" alt="">
                </div>
            </div>
            <div class="bottomright">
                <div class="righttopimg">
                    <img src="./image5.png" alt="">
                </div>
                <div class="rightbottomimg">
                    <img src="./image6.png" alt="">
                </div>
            </div>
        </div>
        <div class="rightdiv">
            <img class="r1" src="./hibis.png" alt="">
            <img class="r2" src="./circle.png" alt="">
            <div class="rightimg">
                <img src="./image7.png" alt="">
            </div>
            <h1>#2022</h1>
            <img class="rose" src="./rose.png" alt="">
        </div>
    </section>
    <footer>
        <div class="footer">
            <div class="leftfooter">
                <h3>I'm very much of the 'buy less but buy <br> better philosophy. It's what I've never really knew</h3>
                <img src="./sign.png" alt="">
            </div>
            <div class="middlefooter">
                <img src="./pinkflower.png" alt="">
                <button>Scroll Down</button>
            </div>
            <div class="rightfooter">
                    <h1>01</h1>
                    <h2>Always be strong <br>and have valus</h2>
                    <div class="righticon">
                    <i class="ri-arrow-right-line" style="color: white;"></i>
                    </div>
            </div>
        </div>
    </footer>
</body>
</html>
